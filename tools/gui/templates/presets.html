<section class="card presets-card" aria-label="Launch presets" data-i18n-aria-label="Launch presets">
  <div class="preset-selector">
    <label for="preset-select" data-i18n="Launch preset">Launch preset</label>
    <select id="preset-select" aria-describedby="preset-hint"></select>
  </div>
  <div class="actions preset-actions">
    <button type="button" id="load-preset" data-i18n="Load preset">Load preset</button>
    <button type="button" id="save-button" data-i18n="Save preset">Save preset</button>
    <button type="button" id="save-as-preset" data-i18n="Save as…">Save as…</button>
    <button type="button" id="rename-preset" class="quiet" data-i18n="Rename">Rename</button>
    <button type="button" id="delete-preset" class="quiet" data-i18n="Delete">Delete</button>
  </div>
  <p id="loaded-preset" class="hint"></p>
  <p id="preset-hint" class="hint" data-i18n="Choose a preset and click Load preset to apply its model files and launch options. Save, Rename, and Delete act on the loaded preset. The executable, models folder, API bind address, and API port are shared. Saving also saves those shared settings.">Choose a preset and click Load preset to apply its model files and launch options. Save, Rename, and Delete act on the loaded preset. The executable, models folder, API bind address, and API port are shared. Saving also saves those shared settings.</p>
</section>
