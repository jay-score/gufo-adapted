name: CI

on:
  push:
    branches: [ main, windows-port ]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [ main, windows-port ]
    paths-ignore:
      - '**/*.md'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gui-dom:
    name: GUI DOM (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    env:
      GUI_TEST_PYTHON: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install GUI fixture dependencies
        run: python -m pip install -r tools/gui/requirements.txt
      - name: Install DOM test dependency
        run: npm install --prefix build/gui-test-js --no-save --package-lock=false --ignore-scripts jsdom@26.1.0
      - name: Check GUI browser behavior
        run: node --experimental-vm-modules --test tests/tools/gui_dom_test.mjs

  windows-cpu:
    name: Windows CPU and launcher checks
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check upstream sync worktree safety
        run: python tests/tools/upstream_sync_test.py
      - name: Check optional GUI launcher
        shell: pwsh
        run: |
          python -m pip install -r tools/gui/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests/tools -p "gui_*_test.py"
      - name: Checkout pinned vcpkg
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/vcpkg
          ref: 9e2895bf6afb246396d85232ba70fcfa1fa67ba1
          path: .vcpkg
      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          & .\.vcpkg\bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and test without a GPU
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          cmd /c "`"$vcvars`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { Set-Item -Path "env:$($matches[1])" -Value $matches[2] }
          }
          cmake --preset cpu-test -DCMAKE_C_COMPILER="C:/Program Files/LLVM/bin/clang.exe" -DCMAKE_CXX_COMPILER="C:/Program Files/LLVM/bin/clang++.exe" "-DCMAKE_TOOLCHAIN_FILE=$pwd/.vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset cpu-test --parallel 2 --target image_test logit_sampler_test platform_tuning_test openai_chat_test http_server_test text_generation_scheduler_test continuation_cache_test text_model_runner_test continuation_disk_store_test qwen38_flash_next_mtp_sampling_test qwen38_flash_next_prompt_lookup_test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item build/cpu-test/vcpkg_installed/x64-windows/bin/*.dll build/cpu-test -Force
          ctest --test-dir build/cpu-test --output-on-failure --no-tests=error --timeout 120 -R '^(image_test|logit_eval_test|logit_sampler_test|platform_tuning_test|openai_chat_test|http_server_test|text_generation_scheduler_test|text_generation_device_loss_test|continuation_cache_test|text_model_runner_test|continuation_disk_store_test|qwen38_flash_next\.(mtp_sampling|prompt_lookup))$'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/tools/windows_launcher_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/tools/windows_setup_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/tools/windows_update_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/tools/windows_vcpkg_path_test.py

  build-and-test:
    name: CPU contracts & repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check upstream sync worktree safety
        run: python3 tests/tools/upstream_sync_test.py

      - name: Compute CMake compiler cache key
        id: ccache-key
        shell: bash
        run: echo "epoch-week=$(( $(date -u +%s) / 604800 ))" >> "$GITHUB_OUTPUT"

      - name: Restore CMake compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/gufo-ccache
          key: gufo-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-${{ steps.ccache-key.outputs.epoch-week }}
          restore-keys: |
            gufo-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-

      - name: Prepare CMake compiler cache
        shell: bash
        run: |
          mkdir -p /tmp/gufo-ccache
          chmod -R a+rwX /tmp/gufo-ccache
          chmod 1777 /tmp/gufo-ccache

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          determinate: false
          extra-conf: |
            extra-sandbox-paths = /tmp/gufo-ccache

      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: false
          use-gha-cache: true

      - name: Run hosted PR checks
        run: |
          nix build .#checks.x86_64-linux.pr --print-build-logs --cores 2 --max-jobs 2
          cat ./result/pr-summary.txt
